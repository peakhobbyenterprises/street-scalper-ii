<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      (function () {
        var path = location.pathname;
        var leaf = path.slice(path.lastIndexOf("/") + 1);
        if (leaf && leaf.indexOf(".") === -1) {
          location.replace(path + "/" + location.search + location.hash);
          return;
        }
        document.write("\u003clink rel=\"manifest\" href=\"./manifest.webmanifest\" />");document.write("\u003clink rel=\"icon\" href=\"./icon-192.png\" />");document.write("\u003clink rel=\"apple-touch-icon\" href=\"./icon-192.png\" />");document.write("\u003cscript type=\"module\" crossorigin src=\"./assets/index-DioDUReS.js\">\u003c/script>");document.write("\u003clink rel=\"stylesheet\" crossorigin href=\"./assets/index-DK5-mR9-.css\">");
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#12080c" />
    <meta name="description" content="Street Scalper II — a free arcade fighter about the release-day line. A Peak Hobby game." />
    <title>STREET SCALPER II</title>
    
    
    
    
    
  </head>
  <body>
    <div id="app">
      <div id="chrome">
        <div id="top-ui">
          <button type="button" id="btn-mute">SOUND</button>
          <button type="button" id="btn-full">FULL</button>
          <button type="button" id="btn-pause" hidden>PAUSE</button>
          <button type="button" id="btn-easy">EASY OFF</button>
        </div>
        <a id="donate" href="#" target="_blank" rel="noopener noreferrer">Optional: Tip $5 via PayPal</a>
      </div>
      <section id="fight-hud" hidden>
        <div class="hud-side">
          <canvas class="bust" id="bust-p1" width="80" height="96"></canvas>
          <div class="hud-read">
            <div class="hud-name" id="name-p1"></div>
            <div class="hud-hp"><span id="hp-p1"></span></div>
            <div class="hud-me"><span id="me-p1"></span></div>
            <div class="hud-pips" id="pips-p1"></div>
          </div>
        </div>
        <div class="hud-mid">
          <div id="hud-timer">99</div>
          <div id="hud-combo"></div>
          <div id="hud-banner"></div>
        </div>
        <div class="hud-side hud-right">
          <div class="hud-read">
            <div class="hud-name" id="name-p2"></div>
            <div class="hud-hp flip"><span id="hp-p2"></span></div>
            <div class="hud-me flip"><span id="me-p2"></span></div>
            <div class="hud-pips right" id="pips-p2"></div>
          </div>
          <canvas class="bust" id="bust-p2" width="80" height="96"></canvas>
        </div>
      </section>
      <div id="stage-wrap">
        <canvas id="game" width="384" height="224"></canvas>
      </div>
      <div id="touch" hidden>
        <div id="easy-row">
          <button type="button" data-e="s1"><span class="btn-k">SPECIAL 1</span><span class="btn-s" id="mv-s1"></span></button>
          <button type="button" data-e="s2"><span class="btn-k">SPECIAL 2</span><span class="btn-s" id="mv-s2"></span></button>
          <button type="button" data-e="s3"><span class="btn-k">SPECIAL 3</span><span class="btn-s" id="mv-s3"></span></button>
          <button type="button" data-e="super" id="btn-super"><span class="btn-k">SUPER</span><span class="btn-s" id="mv-super"></span><i id="super-meter"></i></button>
        </div>
        <div class="cab-row">
          <div class="stick-well">
            <span class="stick-tag up">↑ JUMP</span>
            <span class="stick-tag side">← MOVE →</span>
            <div id="stick" aria-label="Joystick. Up jumps, down crouches, sideways moves. Hold back to block.">
              <div id="knob"></div>
            </div>
            <span class="stick-tag down">↓ CROUCH</span>
            <button type="button" id="btn-block" data-b="block">BLOCK</button>
          </div>
          <div id="pad-col">
            <div id="pad">
              <button type="button" data-b="lp">JAB</button>
              <button type="button" data-b="mp">PUNCH</button>
              <button type="button" data-b="hp">BIG PUNCH</button>
              <button type="button" data-b="lk">QUICK KICK</button>
              <button type="button" data-b="mk">KICK</button>
              <button type="button" data-b="hk">BIG KICK</button>
            </div>
          </div>
        </div>
      </div>
      <div id="tutor" hidden>
        <div class="tutor-card">
          <p id="tutor-kicker">FIRST FIGHT</p>
          <h2 id="tutor-title">MOVE</h2>
          <p id="tutor-body">Push the stick. Up jumps, down crouches, sideways walks. Hold back, or press BLOCK.</p>
          <div class="tutor-actions">
            <button type="button" id="tutor-skip">SKIP</button>
            <button type="button" id="tutor-next">NEXT</button>
          </div>
        </div>
      </div>
      <div id="pause-sheet" hidden>
        <p>PAUSED</p>
        <button type="button" data-p="0">RESUME</button>
        <button type="button" data-p="1">HOW TO PLAY</button>
        <button type="button" data-p="2">EASY SPECIALS</button>
        <button type="button" data-p="3">SOUND</button>
        <button type="button" data-p="4">QUIT TO TITLE</button>
      </div>
    </div>
  </body>
</html>
